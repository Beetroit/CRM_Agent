[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
stdout_logfile=/var/log/rabbitmq.log
stderr_logfile=/var/log/rabbitmq_err.log
autorestart=true
priority=1

[program:fastapi]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
stdout_logfile=/var/log/fastapi.log
stderr_logfile=/var/log/fastapi_err.log
autorestart=true
startsecs=10
priority=2
environment=PYTHONUNBUFFERED=1

[program:langgraph]
command=python3 -m langgraph_app.main
directory=/app
stdout_logfile=/var/log/langgraph.log
stderr_logfile=/var/log/langgraph_err.log
autorestart=true
startsecs=10
priority=3
environment=PYTHONUNBUFFERED=1